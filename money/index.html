/* ============ кнопка «Назад» ============ */
let hDepth = 0, hSkip = 0, guarded = false, lastBack = 0;

    else if (ui.sheet) { if (ui.sheet.step === "cat") ui.sheet.step = "kb"; else ui.sheet = null; }

      ui.sheet = { type: "imp", busy: false, info: "Операций: <b>" + p.out.length + "</b><br>Период: " + dayKey(mn) + " … " + dayKey(mx) + "<br>Категорий: " + cn + "<br>" + (p.neg > 0 ? "Минус = расход, плюс = доход (" + p.neg + " / " + p.pos + ")" : "Все суммы положительные — считаю расходами") + (p.bad ? "<br>Не разобрано строк: " + p.bad : "") + "<br><span class='sub'>Повторный импорт дубли не создаёт.</span>" }; render(); }
    catch (err) { toast(err.message || "Не удалось прочитать файл"); }
    e.target.value = "";
  }
  if (e.target.id === "s-cat" && ui.sheet) ui.sheet.cat = e.target.value;
});

/* ============ старт ============ */
async function rcpShared() {
  if (!/[?&]share=1\b/.test(location.search)) return;
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  try {
    const c = await caches.open("money-share"), r = await c.match("shared"); if (!r) return; const j = await r.json(); await c.delete("shared");
    const text = [j.file, j.text, j.url].filter(Boolean).join("\n");
    if (!text.trim()) { toast("Поделились пустым, чека не вижу"); return; }
    rcpText(text, { subject: j.title || "" });
  } catch (e) { toast("Не получилось принять письмо: " + (e.message || e), "bad", 4000); }
}
(async function boot() {
  applyTheme();
  let early = false; try { const raw = JSON.parse(localStorage.getItem("mytasks-auth") || "null"); if (raw && raw.user && raw.user.id) { user = raw.user; early = true; render(); } } catch (e) {}   // мгновенный первый кадр из локальных данных, не дожидаясь сети и библиотеки
  await new Promise(res => { const sc = document.createElement("script"); sc.src = "supabase-lib.js"; sc.onload = res; sc.onerror = res; document.head.appendChild(sc); });
  if (!window.supabase) { if (!early) $("app").textContent = "Не загрузилась библиотека Supabase"; return; }
  sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { storageKey: "mytasks-auth", persistSession: true, autoRefreshToken: true } });
  try { const s = await sb.auth.getSession(); user = s.data.session ? s.data.session.user : null; } catch (e) {}
  if (!early || !user) render(); if (!user) return;
  runRec(); flush(); pull(!txs.length);
  rcpShared();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { runRec(); flush(); pull(false); } });
  window.addEventListener("online", () => { flush(); pull(false); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
