(async function boot() {
  applyTheme();
  if (!window.supabase) { $("app").textContent = "Не загрузилась библиотека Supabase"; return; }
  sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { storageKey: "mytasks-auth", persistSession: true, autoRefreshToken: true } });
  try { const s = await sb.auth.getSession(); user = s.data.session ? s.data.session.user : null; } catch (e) {}
  render(); if (!user) return;
  flush(); pull(!txs.length);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { flush(); pull(false); } });
  window.addEventListener("online", () => { flush(); pull(false); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
