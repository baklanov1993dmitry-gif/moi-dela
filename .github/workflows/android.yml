name: Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.5" }
      - name: Движок нейроголоса (sherpa-onnx, arm64)
        run: |
          curl -fsSL -o /tmp/sh.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2
          mkdir -p /tmp/sh android/app/src/main/jniLibs && tar xjf /tmp/sh.tar.bz2 -C /tmp/sh && cp -r /tmp/sh/jniLibs/arm64-v8a android/app/src/main/jniLibs/
          rm -f android/app/src/main/jniLibs/arm64-v8a/*cxx-api.so; ls -la android/app/src/main/jniLibs/arm64-v8a
      - name: Keystore
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android/app/release.keystore; echo "key=stable" > key.txt
          else keytool -genkeypair -keystore android/app/release.keystore -alias moidela -keyalg RSA -keysize 2048 -validity 10000 -storepass moidela2026 -keypass moidela2026 -dname "CN=Moi Dela" ; echo "key=temporary" > key.txt; fi
          keytool -list -v -keystore android/app/release.keystore -storepass moidela2026 | grep "SHA256:" | head -1 >> key.txt
          cat key.txt
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease 2>&1 | tee ../build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk moi-dela.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest moi-dela.apk --title "Мои дела (APK)" --notes "$(cat key.txt) · сборка ${GITHUB_RUN_NUMBER}"
      - name: Save log on failure
        if: failure()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan build-log; git rm -rf . -q || true
          tail -n 120 build.log > build-error.txt 2>/dev/null || echo "no log" > build-error.txt
          git add build-error.txt; git commit -qm "build error"; git push -f origin build-log
