name: Run migration (one-off)
on:
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration_v31.sql
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Нет секрета SUPABASE_ACCESS_TOKEN"; exit 1; fi
          python3 - <<'PY' > body.json
          import json
          print(json.dumps({"query": open("migration_v31.sql", encoding="utf-8").read()}))
          PY
          code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/rjiuialimbrnbriqafjl/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @body.json)
          echo "HTTP $code"; cat resp.txt; echo
          [ "$code" = "200" ] || [ "$code" = "201" ]
      - name: Check result
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl -sS -X POST "https://api.supabase.com/v1/projects/rjiuialimbrnbriqafjl/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data '{"query":"select (select count(*) from pg_policies where policyname in ('"'"'mgr_write_tasks'"'"','"'"'mgr_write_lists'"'"')) as policies, (select count(*) from information_schema.columns where table_name='"'"'tasks'"'"' and column_name='"'"'from_mgr'"'"') as col"}'
