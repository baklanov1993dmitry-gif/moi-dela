plugins { id 'com.android.application' }
def runNo = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
android {
    namespace 'com.moidela.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.moidela.app"
        minSdk 21
        targetSdk 34
        versionCode = runNo
        versionName = "1.0." + runNo
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "moidela2026"
            keyAlias "moidela"
            keyPassword "moidela2026"
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
