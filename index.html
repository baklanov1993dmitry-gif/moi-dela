/* ----- сортировка и группировка ----- */

  due: { n: "Срок выполнения", dir: 1, cmp: (a, b) => (a.due || "9999").localeCompare(b.due || "9999") },
  dueimp: { n: "Срок, затем важность", dir: 1, cmp: (a, b) => { const bk = t => !t.due ? 9 : t.due < today ? 0 : t.due === today ? 1 : t.due === addDays(today, 1) ? 2 : t.due <= addDays(today, 7) ? 3 : 4; return (bk(a) - bk(b)) || ((b.starred ? 1 : 0) - (a.starred ? 1 : 0)) || (a.due || "9999").localeCompare(b.due || "9999"); } },
  impdue: { n: "Важность, затем срок", dir: 1, cmp: (a, b) => ((b.starred ? 1 : 0) - (a.starred ? 1 : 0)) || (a.due || "9999").localeCompare(b.due || "9999") },
  imp: { n: "Важность", dir: 1, cmp: (a, b) => (b.starred ? 1 : 0) - (a.starred ? 1 : 0) },
  myday: { n: "Добавлено в «Мой день»", dir: 1, cmp: (a, b) => (inMyDay(b) ? 1 : 0) - (inMyDay(a) ? 1 : 0) },

/* ----- списки и группы ----- */

/* ----- календарь телефона (.ics) ----- */
const icsEsc = s => String(s || "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\;");
const icsUtc = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
const icsFold = l => { const o = []; while (l.length > 60) { o.push(l.slice(0, 60)); l = " " + l.slice(60); } o.push(l); return o.join("\r\n"); };
function buildIcs(t) {
  if (!t || (!t.remind_at && !t.due)) return null;
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Moi dela//RU", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "BEGIN:VEVENT", "UID:" + t.id + "@moi-dela", "SEQUENCE:" + Math.floor(Date.now() / 1000), "DTSTAMP:" + icsUtc(new Date()), "SUMMARY:" + icsEsc(t.title)];
  if (t.note) L.push("DESCRIPTION:" + icsEsc(t.note));
  if (t.remind_at) {
    const s = new Date(t.remind_at), e = new Date(s.getTime() + 15 * 60e3);
    L.push("DTSTART:" + icsUtc(s), "DTEND:" + icsUtc(e), "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(t.title), "TRIGGER:PT0M", "END:VALARM");
  } else {
    L.push("DTSTART;VALUE=DATE:" + t.due.replace(/-/g, ""), "DTEND;VALUE=DATE:" + addDays(t.due, 1).replace(/-/g, ""), "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(t.title), "TRIGGER;RELATED=START:PT9H", "END:VALARM");
  }
  L.push("END:VEVENT", "END:VCALENDAR");
  return L.map(icsFold).join("\r\n") + "\r\n";
}
function exportIcs(id) {
  const txt = buildIcs(S.tasks[id]); if (!txt) return false;
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/calendar" })); a.download = "zadacha.ics";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return true;
}

async function enablePush() {

  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "Браузер не умеет пуши (нужен Chrome по https)";

    if (Notification.permission === "denied") return "Уведомления для этого сайта заблокированы в браузере. Нажмите на значок замка слева от адреса → «Уведомления» → «Разрешить», обновите страницу и повторите";

const pad2 = n => String(n).padStart(2, "0");

function defaultStart(day) {
  const ws = PR.dayStart * 60;

const capacityMin = () => Math.max(0, Math.floor((PR.dayEnd - PR.dayStart) * 60 * (1 - PR.reserve / 100) / 5) * 5);

/* ----- блоки дня ----- */
function layoutCols(arr) {                       // пересекающиеся блоки делят ширину дорожки
  arr.sort((a, b) => a.s - b.s || a.e - b.e);
  let cluster = [], ends = [];
  const close = () => { const n = ends.length; cluster.forEach(x => { x.n = n; }); cluster = []; ends = []; };
  for (const x of arr) {
    if (cluster.length && ends.every(e => e <= x.s)) close();
    let c = ends.findIndex(e => e <= x.s); if (c < 0) { c = ends.length; ends.push(0); }
    ends[c] = x.e; x.c = c; cluster.push(x);
  }
  close(); return arr;
}
function dayBlocks(day) {
  const plan = [], fact = [];
  for (const id in S.tasks) {
    const t = S.tasks[id]; if (!t.plan_start || dayOf(t.plan_start) !== day) continue;
    const s = minOf(t.plan_start), d = t.est_minutes || 30; plan.push({ k: "plan", id, t, s, e: Math.min(s + d, 1440), d, est: !!t.est_minutes });
  }
  for (const id in S.time_log) {
    const l = S.time_log[id]; if (!l.start_at || dayOf(l.start_at) !== day) continue;
    const s = minOf(l.start_at), e = Math.min(Math.max(s + Math.round((Date.parse(l.end_at) - Date.parse(l.start_at)) / 60000), s + 5), 1440);
    fact.push({ k: "log", id, l, s, e, d: e - s });
  }
  return { plan: layoutCols(plan), fact: layoutCols(fact) };
}
const candSub = t => [t.est_minutes ? "~" + fmtDurM(t.est_minutes) : "~30 м?", dueInfo(t) ? esc(dueInfo(t).txt) : ""].filter(Boolean).join(" · ");
function dayCands(day, q) {
  const out = [], ql = (q || "").trim().toLowerCase();
  for (const id in S.tasks) {
    const t = S.tasks[id]; if (t.done) continue;
    if (t.plan_start && dayOf(t.plan_start) === day) continue;
    let sc;
    if (ql) { if (t.title.toLowerCase().indexOf(ql) < 0) continue; sc = 0; }
    else if (t.status === "someday") continue;
    else if (t.due && t.due < day) sc = 100 + Math.min(30, Math.round((parseISO(day) - parseISO(t.due)) / 864e5));
    else if (t.due === day) sc = 80;

    else continue;
    if (t.starred) sc += 25;
    out.push({ t, sc });
  }
  out.sort((a, b) => b.sc - a.sc || (a.t.est_minutes || 30) - (b.t.est_minutes || 30) || String(b.t.created_at).localeCompare(String(a.t.created_at)));
  return out;
}

function parseTimeText(s) {
  s = String(s || "").trim().replace(/[.,\s-]+/g, ":");

    const im = new Image();

      const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      try { TH.bg = c.toDataURL("image/jpeg", 0.8); saveTheme(); } catch (e) { toast("Картинка слишком большая"); return; }

    e.preventDefault(); move(e.clientX, e.clientY);
  });
  window.addEventListener("mouseup", () => { if (st && !st.touch) end(false); });
  app.addEventListener("click", e => { if (window.__lsd && Date.now() - window.__lsd < 400) { e.stopPropagation(); e.preventDefault(); } }, true);
}
// ----- позиция всплывающего меню: всегда целиком в окне + барабаны времени -----
function fitPop() {
  const pop = $("pop"); if (!pop) return;
  document.querySelectorAll("#pop .drum").forEach(d => { d.scrollTop = (+d.dataset.sel || 0) * 36; });
  if (isMobile()) return;
  const m = 12, vh = window.innerHeight, vw = window.innerWidth;
  pop.style.maxHeight = (vh - 2 * m) + "px";
  const r = pop.getBoundingClientRect();
  let top = parseFloat(pop.style.top) || r.top, left = parseFloat(pop.style.left) || r.left;
  if (top + r.height > vh - m) top = Math.max(m, vh - m - r.height);
  if (left + r.width > vw - m) left = Math.max(m, vw - m - r.width);
  pop.style.top = top + "px"; pop.style.left = left + "px";
}

const AUTH_ERR = [[/Invalid login/i, "Неверная почта или пароль"], [/not confirmed/i, "Почта не подтверждена: отключите «Confirm email» в Supabase (Auth → Providers → Email) или подтвердите письмо"],

  [/fetch|network|Load failed/i, "Нет связи с сервером (сеть или блокировка). Нажмите «Проверить связь»"], [/valid email|invalid.*email/i, "Похоже, почта введена с ошибкой"]];
function authErr(e) { const m = (e && e.message) || String(e); for (const r of AUTH_ERR) if (r[0].test(m)) return r[1]; return "Ошибка: " + m; }
async function doAuth(kind) {
  const email = ($("a-email") || {}).value, password = ($("a-pass") || {}).value;
  if (!email || !password) return showMsg("Введите почту и пароль", false);
  if (ui.busy) return; ui.busy = true; showMsg("Подождите…", true);
  try {
    const r = kind === "login" ? await sb.auth.signInWithPassword({ email: email.trim(), password }) : await sb.auth.signUp({ email: email.trim(), password });
    if (r.error) return showMsg(authErr(r.error), false);
    const sess = r.data && r.data.session;
    if (sess) { showMsg("", true); setUser(sess.user); }
    else showMsg("Аккаунт создан, но Supabase требует подтвердить почту. Подтвердите письмо или отключите «Confirm email» и нажмите «Войти».", false);
  } catch (e) { showMsg(authErr(e), false); }
  finally { ui.busy = false; }
}
async function ping() {
  const f1 = $("c-url"), f2 = $("c-key");
  const url = f1 ? normUrl(f1.value) : cfg.url, key = f2 ? f2.value.trim() : cfg.key;
  if (!url) return showMsg("Сначала укажите адрес проекта", false);
  showMsg("Проверяю связь…", true);
  const t0 = Date.now(), ac = new AbortController(), to = setTimeout(() => ac.abort(), 8000);
  try {
    const r = await fetch(url + "/auth/v1/health", { headers: { apikey: key }, signal: ac.signal }); clearTimeout(to);
    if (r.ok) showMsg("✅ Связь есть (" + (Date.now() - t0) + " мс). Сервер отвечает.", true);
    else showMsg("⚠️ Сервер ответил кодом " + r.status + (r.status === 401 || r.status === 403 ? " — проверьте публичный ключ" : "") + ".", false);
  } catch (e) { clearTimeout(to); showMsg("❌ Нет связи (" + (e.name === "AbortError" ? "таймаут 8 с" : "сеть или блокировка") + "). Если это рабочий компьютер — возможно, блокирует фильтр.", false); }
}
function saveCfg() {
  const url = normUrl($("c-url").value), key = $("c-key").value.trim();
  if (!/^https:\/\/.+/.test(url)) return showMsg("Адрес должен начинаться с https://", false);
  let role = ""; try { role = JSON.parse(atob(key.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).role; } catch (e) {}
  if (role === "service_role" || /^sb_secret_/.test(key)) return showMsg("⛔ Это СЕКРЕТНЫЙ ключ. Нужен публичный (anon / publishable).", false);
  if (key.length < 20) return showMsg("Ключ слишком короткий", false);
  jset(LSK.cfg, { url, key }); cfg = getCfg(); screen = null; ui.msg = ""; boot();
}
function setUser(u) {
  const cur = S.user ? S.user.id : null, nid = u ? u.id : null;
  if (cur === nid) { if (u && S.user) S.user.email = u.email || S.user.email; return; }

async function boot() {
  cfg = getCfg();

  if (!window.supabase || !window.supabase.createClient) { $("app").textContent = "Не загрузилась библиотека Supabase. Пересоберите файл."; return; }
  sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { storageKey: "mytasks-auth", persistSession: true, autoRefreshToken: true } });
  sb.auth.onAuthStateChange((ev, session) => { setTimeout(() => setUser(session && session.user), 0); });

  else {

function syncHistory() {

  } catch (e) {}
}
